<!DOCTYPE html>
<html>
    <head>
        <title>Bootstrap4_4</title>
        <link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
        <style type="text/css">
            .col-md-1, .col-md-2, .col-md-3, .col-md-4, .col-md-5, .col-md-6, .col-md-7, .col-md-8, .col-md-9, .col-md-10, .col-md-11, .col-md-12,
            .col-xs-1, .col-xs-2, .col-xs-3, .col-xs-4, .col-xs-5, .col-xs-6, .col-xs-7, .col-xs-8, .col-xs-9, .col-xs-10, .col-xs-11, .col-xs-12,
            .col-sm-1, .col-sm-2, .col-sm-3, .col-sm-4, .col-sm-5, .col-sm-6, .col-sm-7, .col-sm-8, .col-sm-9, .col-sm-10, .col-sm-11, .col-sm-12
        {
            background-color: #FF8000;
            border: 1px solid white;
            font-weight: bold;
            color: white;
            height: auto;
        }
        </style>
    </head>
    <body>
        <div class="container"><br>
            <h4>Типы кнопок</h4>
            <button type="button" class="btn btn-default">По умолчанию</button>
            <button type="button" class="btn btn-primary">Основная</button>
            <button type="button" class="btn btn-success">Успех</button>
            <button type="button" class="btn btn-info">Информация</button>
            <button type="button" class="btn btn-warning">Предупреждение</button>
            <button type="button" class="btn btn-danger">Опасный</button>
            <button type="button" class="btn btn-link">Ссылка</button>
            <h4>Размеры кнопок</h4>
            <button type="button" class="btn btn-primary btn-lg">Большая кнопка</button>
            <button type="button" class="btn btn-success">Обычная кнопка</button>
            <button type="button" class="btn btn-info btn-sm">Маленькая кнопка</button>
            <button type="button" class="btn btn-warning btn-xs">Самая маленькая кнопка</button><br><br>
            <button type="button" class="btn btn-danger btn-block">Кнопка под размер блока</button>
            <h4>Активные кнопки</h4>
            <button type="button" class="btn btn-default active">По умолчанию</button>
            <button type="button" class="btn btn-primary active">Основная</button>
            <button type="button" class="btn btn-success active">Успех</button>
            <button type="button" class="btn btn-info active">Информация</button>
            <button type="button" class="btn btn-warning active">Предупреждение</button>
            <button type="button" class="btn btn-danger active">Опасный</button>
            <button type="button" class="btn btn-link active">Ссылка</button>
        </div>
        <script src="http://code.jquery.com/jquery-latest.js"></script>
        <script src="bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
    </body>
