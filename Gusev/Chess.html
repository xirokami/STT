<script>
    let i = 0;
    document.getElementById('box').addEventListener('click', function() {
        console.log(i)
        const whitePieces = ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖'];
        const blackPieces = ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'];
        const whitePawns = Array(8).fill('♙');
        const blackPawns = Array(8).fill('♟');

        const rows = document.querySelectorAll('#box > div');
        if (i == 0) {

            Array.from(rows[0].children).forEach((cell, index) => {
            cell.textContent = whitePieces[index];
            });

            Array.from(rows[1].children).forEach((cell, index) => {
            cell.textContent = whitePawns[index];
            });

            Array.from(rows[6].children).forEach((cell, index) => {
            cell.textContent = blackPawns[index];
            });

            Array.from(rows[7].children).forEach((cell, index) => {
            cell.textContent = blackPieces[index];
            });
            i ++
        } else if (i == 1) {
            rows[1].children[5].textContent = ""
            rows[3].children[5].textContent = "♙"
            i ++
        } else if (i == 2) {
            rows[6].children[4].textContent = ""
            rows[5].children[4].textContent = "♟"
            i ++
        } else if (i == 3) {
            rows[1].children[6].textContent = ""
            rows[3].children[6].textContent = "♙"
            i ++
        } else if (i == 4) {
            rows[7].children[3].textContent = ""
            rows[3].children[7].textContent = "♛"
            i ++
        } else if (i > 4) {
            alert('Мат белым(не расисты)')
        }

    });
