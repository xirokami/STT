<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки профиля</title>
    <link rel="stylesheet" href="setting.css">
</head>
<body>
    <div class="settings-container">
        <h1>Настройки профиля</h1>
        
        <div class="slider-container">
            <div class="slider-title">Здоровье Ивана Викторовича</div>
            <input type="range" min="0" max="100" value="100" step="1" id="slider">
            <div id="slider-value" class="slider-value">100%</div>
        </div>

        <div class="button-container">
            <button class="colora" onclick="saveSettings()">Сохранить изменения</button>
            <a href="profil.html" class="back-button">
                <button class="colora">Вернуться в профиль</button>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const slider = document.getElementById("slider"); 
            const sliderValueDisplay = document.getElementById("slider-value"); 

            slider.addEventListener('input', function() {
                sliderValueDisplay.textContent = this.value + '%';
                console.log('Текущее значение слайдера:', this.value);
            });
        });

        function saveSettings() {
            alert('Настройки сохранены!');
        }
    </script>
</body>
</html>
