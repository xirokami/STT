<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link href="/public/main.css" rel="stylesheet">
    <title>Авторизация</title>
</head>
<body>
<div class="register-card" id="app">
    <div class="card-header">
        <h1>📝 Авторизация</h1>
    </div>
    <div class="card-body">
        <form id="registerForm" action="/login" method="post" novalidate>
            <div class="form-group">
                <label>Логин <span class="required">*</span></label>
                <input type="text" id="login" name="login" placeholder="например: john1984" autocomplete="off">
                <div class="hint">только латиница и цифры, не менее 6 символов</div>
                <div id="loginError" class="error-message" style="display: none;"></div>
            </div>

            <div class="form-group">
                <label>Пароль <span class="required">*</span></label>
                <input type="password" id="password" name="password" placeholder="минимум 8 символов">
                <div class="hint">не менее 8 любых символов</div>
                <div id="passwordError" class="error-message" style="display: none;"></div>
            </div>

            <button type="submit" id="submitBtn" onclick="location.href='/zaya'">Авторизоваться</button>
        </form>

        <div id="globalMessage" class="global-msg" style="display: none;"></div>
    </div>
</div>

<script src="/public/main.js"></script>
</body>
</html>
