<!DOCTYPE html>
<html>
    <body>
        <div class="game">
            <div class = "row" id = "row 1">
                <div class = "field" name = "0" id ="0">1 </div>
                <div class = "field" name = "0" id ="1"> </div>
                <div class = "field" name = "0" id ="2"> </div>
            </div>
            <div class = "row" id = "row 2">
                <div class = "field" id="3"> </div>
                <div class = "field" id="4"> </div>
                <div class = "field" id="5"> </div>
            </div>
            <div class = "row" id = "row 3">
                <div class = "field" id ="6"> </div>
                <div class = "field" id ="7"> </div>
                <div class = "field" id ="8"> </div>
            </div>
        </div>
        <script>
            let step = 0
            let fld = document.getElementsByClassName("field")

            const winningCombinations = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];

            function reset(){
                for (let field of fld) {
                    field.textContent = "";
                }
                step = 0; 
            }

            function scan(){
                for(let comb of winningCombinations){
                    let [a, b, c] = comb;
                    if (fld[a].textContent && fld[a].textContent === fld[b].textContent && fld[a].textContent === fld[c].textContent){
                        alert(`Игрок ${fld[a].textContent} победил`)
                        reset()
                    }
                }
                if ([...fld].every(field => field.textContent)) {
                    alert("Ничья")
                    reset()
                }
            }

            for (let value of fld){
                value.textContent = ""
                value.addEventListener("click", () => {
                    if (step%2 == 0 & value.textContent == ""){
                        value.textContent = "X"
                        step++
                    }
                    else if (step%2 == 1 & value.textContent == ""){
                        value.textContent = "O"
                        step++
                    }
                    {alert("жирни")}
                    scan()
                })
            } 

        </script>
    </body>
    <style>
        *{
            margin: 0;
        }
        .field {
            width: 50px;
            height: 50px;
            background-color: aliceblue;
            border: 1px black solid; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .game {
            align-items: center;
            display: flex;
            justify-content: center;
            flex-direction: column;
        }
        .row {
            display: flex;
            color: red;
        }
        
    </style>
</html>
