<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Регистрация</title>
    <link rel="stylesheet" href="public/style.css">
</head>
<body>
<div class="register-card">
    <div class="register-header">
        <h1>Создать аккаунт</h1>
        <p>Заполните все поля </p>
    </div>

    <form id="registerForm" novalidate>
        <div class="input-group">
            <label>Логин <span>*</span></label>
            <input type="text" id="login" placeholder="Уникальный логин" autocomplete="off" required>
            <div class="field-hint">Только латиница и цифры, минимум 6 символов</div>
            <div class="error-message" id="loginError"></div>
        </div>

        <div class="input-group">
            <label>Пароль <span>*</span></label>
            <input type="password" id="password" placeholder="Пароль" required>
            <div class="field-hint">Не менее 8 символов</div>
            <div class="error-message" id="passwordError"></div>
        </div>

        <div class="input-group">
            <label>ФИО <span>*</span></label>
            <input type="text" id="fullname" placeholder="Иванов Иван Иванович" required>
            <div class="field-hint">Только кириллица и пробелы</div>
            <div class="error-message" id="fullnameError"></div>
        </div>

        <div class="input-group">
            <label>Телефон <span>*</span></label>
            <input type="tel" id="phone" placeholder="89991234567" required>
            <div class="field-hint">Формат: 8XXXXXXXXXX</div>
            <div class="error-message" id="phoneError"></div>
        </div>

        <div class="input-group">
            <label>Email <span>*</span></label>
            <input type="email" id="email" placeholder="name@example.com" required>
            <div class="field-hint">example@domain.com</div>
            <div class="error-message" id="emailError"></div>
        </div>

        <button type="submit" class="btn-create">Зарегистрироваться</button>
        <div id="globalFeedback" class="form-feedback"></div>
        <hr />
        <div class="field-hint" style="text-align: center;">Все поля обязательны</div>
    </form>
</div>
</body>
  <script src="public/script.js"></script>
</html>
