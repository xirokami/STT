<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <section class="page hidden" id="page-login">
        <div class="auth-container">
            <div class="auth-card">
                <h2>Вход в систему</h2>
                <p class="auth-subtitle">Введите свои данные для входа</p>
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="loginLogin">Логин</label>
                        <input type="text" id="loginLogin" placeholder="Введите логин">
                        <span class="error-msg" id="error-loginLogin"></span>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" placeholder="Введите пароль">
                        <span class="error-msg" id="error-loginPassword"></span>
                    </div>
                    <button type="submit" class="button">Войти</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
