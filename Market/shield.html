<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Защита сайта</title>
    <link rel="stylesheet" href="shield.css">
</head>
<body>
    <button class="back-button" onclick="location.href='profil.html'">
        Вернуться в профиль
    </button>

    <div class="shield-container" id="shield">
        <div class="shield-text" id="status">Не защищено</div>
    </div>

    <script>
        const shield = document.getElementById('shield');
        const statusText = document.getElementById('status');
        
        let isProtected = false;
        
        shield.addEventListener('click', () => {
            if (!isProtected) {
                shield.style.backgroundColor = '#28a745'; 
                statusText.textContent = 'Защита активирована';
                isProtected = true;
            } else {
                shield.style.backgroundColor = '#808080';
                statusText.textContent = 'Не защищено';
                isProtected = false;
            }
        });
    </script>
</body>
</html>
