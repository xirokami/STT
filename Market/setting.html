<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки профиля</title>
    <link rel="stylesheet" href="setting.css">
</head>
<body>
    <div class="settings-container">
        <h1>Настройки профиля</h1>
        
        <div class="slider-container">
            <div class="slider-title">Здоровье Ивана Викторовича</div>
            <input type="range" min="0" max="100" value="100" class="volume-slider" step="1">
            <div class="slider-value">100%</div>
        </div>
        
        <div class="slider-container">
            <div class="slider-title">Процент хорошей оценки</div>
            <input type="range" min="0" max="100" value="10" class="brightness-slider" step="1">
            <div class="slider-value">10%</div>
        </div>
        
        <div class="slider-container">
            <div class="slider-title">Надежда на бога</div>
            <input type="range" min="0" max="100" value="70" class="animation-slider" step="1">
            <div class="slider-value">70%</div>
        </div>
        
        <div class="button-container">
            <button onclick="saveSettings()">Сохранить изменения</button>
            <a href="profil.html" class="back-button">
                <button>Вернуться в профиль</button>
            </a>
        </div>
    </div>
</body>
</html>
