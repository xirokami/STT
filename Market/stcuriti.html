<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Защита сайта</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        
        .shield-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #808080; /* Серый цвет */
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .shield-text {
            margin-top: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="shield-container" id="shield">
        <div class="shield-text" id="status">Не защищено</div>
    </div>

    <script>
        const shield = document.getElementById('shield');
        const statusText = document.getElementById('status');
        
        let isProtected = false;
        
        shield.addEventListener('click', () => {
            if (!isProtected) {
                shield.style.backgroundColor = '#28a745'; 
                statusText.textContent = 'Защита активирована';
                isProtected = true;
            } else {
                shield.style.backgroundColor = '#808080';
                statusText.textContent = 'Не защищено';
                isProtected = false;
            }
        });
    </script>
</body>
</html>
